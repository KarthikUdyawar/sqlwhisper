default_language_version:
  python: python3.12

default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  # ── General hygiene ─────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [ --fix=lf ]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-ast
      - id: debug-statements
        language_version: python3.12
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [ --maxkb=2048 ]
      - id: no-commit-to-branch
        args:
          - --branch=master
          # - --branch=develop
          - --pattern=release/.*

  # ── Ruff (lint + format) ────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format

  # ── Bandit (security) ───────────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [ "-c", "pyproject.toml", "--format=screen", "--quiet" ]

  # ── Gitleaks (secret scanning) ──────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Mypy (type checking) ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        files: \.pyi?$
        exclude: ^tests/
        language_version: python3.12
        args: [ --strict, --pretty, --show-error-codes ]
        additional_dependencies:
          - pydantic-settings>=2.0
          - pyyaml>=6.0
          - types-PyYAML
          - sqlalchemy[mypy]
          - fastapi>=0.111
          - sqlglot>=23.0
          - httpx>=0.27
          - pandas>=2.0
          - ollama>=0.2
          - streamlit>=1.35

  # ── pydocstyle (Docstring linting) ──────────────────────────────────────────
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        files: \.py$
        exclude: ^tests/|^docs/
        args:
          - --convention=google # or pep257 / numpy
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107  # ignore common "missing docstring" errors if you prefer

  # ── pydoclint (docstring vs code consistency) ───────────────────────────────
  - repo: https://github.com/jsh9/pydoclint
    rev: 0.8.6   # Check latest at https://github.com/jsh9/pydoclint/releases
    hooks:
      - id: pydoclint
        args:
          - --style=google   # or numpy / sphinx
          # Optional useful flags:
          # - --check-return-types=False
          # - --check-raises=False
          # - --ignore=DOC201,DOC202  # ignore specific errors if needed
        files: \.py$
        exclude: ^tests/|^docs/   # adjust as needed
