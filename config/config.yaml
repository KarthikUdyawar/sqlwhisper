# SQLWhisper — non-secret configuration
#
# Rules:
#   - NEVER put secrets here (DB passwords, API keys, tokens).
#   - Secrets go in .env / .env.<environment> (see .env.example).
#   - Values here are overridable via env vars: SQLWHISPER_<SECTION>__<KEY>
#
# Loaded by: src/core/config.py → Settings._merge_yaml_defaults()

ollama:
  base_url: http://localhost:11434
  model: qwen3:8b
  fallback_model: deepseek-coder:6.7b
  timeout_seconds: 30

# DB dialect per alias — non-secret, lives here. The matching URL (secret) comes
# from .env via SQLWHISPER_DATABASES__<ALIAS>__URL — see .env.example.
# Every alias with a URL in .env MUST have a matching dialect entry below,
# or Settings() will fail validation at startup.
databases:
  default:
    dialect: postgresql
  local:
    dialect: sqlite

app:
  max_rows: 500
  max_retries: 3
  max_tables_in_prompt: 5
