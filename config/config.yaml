# SQLWhisper — non-secret configuration.
# Secrets (database URLs) NEVER go here — they live in .env only.
# Every `databases.<alias>` entry below needs a matching
# `SQLWHISPER_DATABASES__<ALIAS>__URL` in .env (see .env.example).

ollama:
  base_url: http://localhost:11434
  model: qwen3:8b
  fallback_model: qwen3:14b
  timeout_seconds: 30

databases:
  default:
    dialect: postgresql
  local:
    dialect: sqlite

# MCP server registry (PRD §8). stdio is the v2.0 default transport —
# simplest, matches single-instance Docker deployment. sse is the
# documented upgrade path for a remote/multi-tenant MCP server; not
# required for v2.0 launch, kept here as a commented example.
mcp_servers:
  postgres:
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-postgres"]

  # postgres_remote:
  #   transport: sse
  #   url: http://localhost:3001/sse

app:
  max_rows: 500
  max_retries: 3
  max_tables_in_prompt: 5
  max_tool_calls_per_turn: 8
